name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is from main branch
        run: |
          # Ottieni il commit del tag
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          # Verifica se il commit è nel branch main
          if ! git branch -r --contains $TAG_COMMIT | grep -q 'origin/main'; then
            echo "Error: Tag must be created from main branch"
            exit 1
          fi
          echo "Tag is from main branch, proceeding with release"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -s .m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: assemblies/assemblies-parquet-enhanced/target/hop-parquet-plugin-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
